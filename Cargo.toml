[workspace]
resolver = "3"
members = [
    "crates/aether-core",
    "crates/aether-cli",
    "crates/aether-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Salih Gencer <salih@aether.dev>"]
license = "MIT"
repository = "https://github.com/salihgencer/aether"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.24", features = ["v4", "serde"] }
aether-core = { path = "crates/aether-core" }
